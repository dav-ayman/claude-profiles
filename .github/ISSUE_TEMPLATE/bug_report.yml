name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `claude-profiles doctor`
      description: Paste the full output. It contains no tokens, only paths and the signed-in email, which you can blank out.
      render: text
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.5, Apple Silicon
    validations:
      required: true
