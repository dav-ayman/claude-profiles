<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">claude-profiles</title>
  <desc id="d">Run work and personal Claude Desktop and Claude Code profiles side by side on one Mac.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1424"/>
      <stop offset="1" stop-color="#1B1530"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0875E"/>
      <stop offset="1" stop-color="#D9653F"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="28" fill="url(#grid)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="88" y="214" fill="#FFFFFF" font-size="74" font-weight="800" letter-spacing="-1.5">claude-profiles</text>
    <text x="90" y="272" fill="#C9CFE0" font-size="30" font-weight="500">Work and personal Claude, side by side on one Mac.</text>
    <text x="90" y="314" fill="#8E96AE" font-size="24">Separate sign-ins, chats, MCP servers and Claude Code settings.</text>

    <g font-size="20" font-weight="600">
      <rect x="90" y="352" width="176" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="178" y="380" fill="#E6E9F2" text-anchor="middle">Claude Desktop</text>
      <rect x="280" y="352" width="190" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="375" y="380" fill="#E6E9F2" text-anchor="middle">Claude Code CLI</text>
      <rect x="484" y="352" width="118" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="543" y="380" fill="#E6E9F2" text-anchor="middle">macOS</text>
      <rect x="616" y="352" width="118" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="675" y="380" fill="#E6E9F2" text-anchor="middle">No sudo</text>
    </g>
  </g>

  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="24">
    <rect x="90" y="448" width="644" height="112" rx="14" fill="#090C16" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="116" cy="472" r="6" fill="#FF5F57"/><circle cx="136" cy="472" r="6" fill="#FEBC2E"/><circle cx="156" cy="472" r="6" fill="#28C840"/>
    <text x="116" y="512" fill="#7EE787">$</text><text x="140" y="512" fill="#E6E9F2">claude-profiles add work --default</text>
    <text x="116" y="544" fill="#7EE787">$</text><text x="140" y="544" fill="#E6E9F2">claude-profiles add personal</text>
  </g>

  <!-- two launcher tiles (generic artwork) -->
  <g filter="url(#shadow)">
    <rect x="842" y="150" width="190" height="190" rx="44" fill="url(#tile)"/>
    <rect x="1010" y="300" width="190" height="190" rx="44" fill="url(#tile)"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <rect x="886" y="198" width="102" height="80" rx="12"/>
    <path d="M886 222h102"/>
    <rect x="1054" y="348" width="102" height="80" rx="12"/>
    <path d="M1054 372h102"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="46" text-anchor="middle">
    <circle cx="1002" cy="310" r="40" fill="#2563EB" stroke="#FFFFFF" stroke-width="7"/>
    <text x="1002" y="326" fill="#FFFFFF">W</text>
    <circle cx="1170" cy="460" r="40" fill="#16A34A" stroke="#FFFFFF" stroke-width="7"/>
    <text x="1170" y="476" fill="#FFFFFF">P</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#C9CFE0" text-anchor="middle">
    <text x="937" y="384">Claude Work</text>
    <text x="1105" y="534">Claude Personal</text>
  </g>
</svg>
