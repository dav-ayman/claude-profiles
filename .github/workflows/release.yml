name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(bin/claude-profiles version | awk '{print $2}')"
          [ "$want" = "$have" ] || { echo "tag $want != script version $have"; exit 1; }
      - name: Test
        run: |
          brew install bats-core
          bats test/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[?" v { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
