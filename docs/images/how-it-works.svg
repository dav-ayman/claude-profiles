<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">How claude-profiles works</title>
  <desc id="d">Each launcher and CLI command starts the same, unmodified Claude with its own data folder and Claude Code config folder.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#F8FAFC" stroke="#E2E8F0"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="64" font-size="18" font-weight="700" fill="#64748B" letter-spacing="1.5">YOU OPEN</text>
    <text x="482" y="64" font-size="18" font-weight="700" fill="#64748B" letter-spacing="1.5">SAME APP</text>
    <text x="820" y="64" font-size="18" font-weight="700" fill="#64748B" letter-spacing="1.5">SEPARATE DATA</text>

    <!-- work row -->
    <rect x="60" y="96" width="330" height="76" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="102" cy="134" r="20" fill="#2563EB"/><text x="102" y="142" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">W</text>
    <text x="136" y="128" font-size="21" font-weight="700" fill="#0F172A">Claude Work.app</text>
    <text x="136" y="154" font-size="16" fill="#64748B">Desktop launcher</text>

    <rect x="60" y="188" width="330" height="76" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="84" y="234" font-size="22" font-weight="700" fill="#2563EB" font-family="SFMono-Regular, Menlo, monospace">&gt;_</text>
    <text x="136" y="220" font-size="21" font-weight="700" fill="#0F172A" font-family="SFMono-Regular, Menlo, monospace">claude-work</text>
    <text x="136" y="246" font-size="16" fill="#64748B">Claude Code command</text>

    <!-- personal row -->
    <rect x="60" y="300" width="330" height="76" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="102" cy="338" r="20" fill="#16A34A"/><text x="102" y="346" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">P</text>
    <text x="136" y="332" font-size="21" font-weight="700" fill="#0F172A">Claude Personal.app</text>
    <text x="136" y="358" font-size="16" fill="#64748B">Desktop launcher</text>

    <rect x="60" y="392" width="330" height="76" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="84" y="438" font-size="22" font-weight="700" fill="#16A34A" font-family="SFMono-Regular, Menlo, monospace">&gt;_</text>
    <text x="136" y="424" font-size="21" font-weight="700" fill="#0F172A" font-family="SFMono-Regular, Menlo, monospace">claude-personal</text>
    <text x="136" y="450" font-size="16" fill="#64748B">Claude Code command</text>

    <!-- middle -->
    <rect x="482" y="196" width="250" height="172" rx="18" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="607" y="250" font-size="24" font-weight="800" fill="#9A3412" text-anchor="middle">Claude.app</text>
    <text x="607" y="280" font-size="17" fill="#9A3412" text-anchor="middle">+ Claude Code CLI</text>
    <text x="607" y="318" font-size="15" fill="#C2410C" text-anchor="middle">unmodified</text>
    <text x="607" y="340" font-size="15" fill="#C2410C" text-anchor="middle">auto-updates as usual</text>

    <!-- right -->
    <rect x="820" y="112" width="320" height="136" rx="14" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="842" y="146" font-size="18" font-weight="700" fill="#1E3A8A">Work</text>
    <text x="842" y="178" font-size="15" fill="#1E40AF" font-family="SFMono-Regular, Menlo, monospace">~/Library/Application</text>
    <text x="842" y="198" font-size="15" fill="#1E40AF" font-family="SFMono-Regular, Menlo, monospace">  Support/Claude</text>
    <text x="842" y="228" font-size="15" fill="#1E40AF" font-family="SFMono-Regular, Menlo, monospace">~/.claude</text>

    <rect x="820" y="316" width="320" height="136" rx="14" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="842" y="350" font-size="18" font-weight="700" fill="#14532D">Personal</text>
    <text x="842" y="382" font-size="15" fill="#166534" font-family="SFMono-Regular, Menlo, monospace">~/Library/Application</text>
    <text x="842" y="402" font-size="15" fill="#166534" font-family="SFMono-Regular, Menlo, monospace">  Support/Claude-personal</text>
    <text x="842" y="432" font-size="15" fill="#166534" font-family="SFMono-Regular, Menlo, monospace">~/.claude-personal</text>

    <text x="600" y="516" font-size="17" fill="#475569" text-anchor="middle">Launchers pass --user-data-dir and CLAUDE_CONFIG_DIR. Nothing inside Claude.app is changed.</text>
  </g>

  <g fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M390 134 C440 134 440 250 478 258"/>
    <path d="M390 226 C440 226 440 270 478 274"/>
    <path d="M390 338 C440 338 440 300 478 292"/>
    <path d="M390 430 C440 430 440 320 478 308"/>
    <path d="M732 260 C780 260 780 180 816 180"/>
    <path d="M732 304 C780 304 780 384 816 384"/>
  </g>
</svg>
